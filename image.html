<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Image Search</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Link back to main search page only -->
    <div id="nav-top">
        <a href="index.html">Google Search</a>
    </div>

    <!-- Image search form -->
    <form id="imageForm" action="https://www.google.com/search" method="get">
        <input type="hidden" name="tbm" value="isch">
        <div class="field">
            <input type="text" name="q" placeholder="Search Images" required>
        </div>
        <div class="buttons">
            <button type="submit">Search Images</button>
        </div>
    </form>
</body>
</html>
