<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Image Search</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Back to main search page link -->
    <div id="nav-top">
        <a href="index.html">Google Search</a>
    </div>

    <!-- Image search form -->
    <form id="imageForm" action="https://www.google.com/search" method="get">
        <!-- hidden field to request images -->
        <input type="hidden" name="tbm" value="isch">
        <!-- query input -->
        <input type="text" name="q" placeholder="Search Images" required>
        <!-- submit button for images -->
        <button type="submit">Search Images</button>
    </form>
</body>
</html>
