<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Advanced Search</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Back link to the main search page -->
    <div id="nav-top">
        <a href="index.html">Google Search</a>
    </div>

    <!-- Advanced search form with four parameters -->
    <form id="advForm" action="https://www.google.com/search" method="get">
        <label>All these words: <input type="text" name="as_q"></label><br>
        <label>Exact phrase: <input type="text" name="as_epq"></label><br>
        <label>Any of these words: <input type="text" name="as_oq"></label><br>
        <label>Exclude words: <input type="text" name="as_eq"></label><br>
        <!-- Advanced Search button -->
        <button type="submit" class="advanced">Advanced Search</button>
    </form>
</body>
</html>
