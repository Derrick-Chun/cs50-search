<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Advanced Search</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Link back to main search page only -->
    <div id="nav-top">
        <a href="index.html">Google Search</a>
    </div>

    <!-- Advanced search form -->
    <form id="advForm" action="https://www.google.com/search" method="get">
        <div class="field">
            <label>All these words: <input type="text" name="as_q"></label>
        </div>
        <div class="field">
            <label>Exact phrase: <input type="text" name="as_epq"></label>
        </div>
        <div class="field">
            <label>Any of these words: <input type="text" name="as_oq"></label>
        </div>
        <div class="field">
            <label>Exclude words: <input type="text" name="as_eq"></label>
        </div>
        <div class="buttons">
            <button type="submit" class="advanced">Advanced Search</button>
        </div>
    </form>
</body>
</html>
