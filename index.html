<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Search</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="nav-top">
        <a href="image.html">Image Search</a> |
        <a href="advanced.html">Advanced Search</a>
    </div>

    <form id="searchForm" action="https://www.google.com/search" method="get">
        <!-- Text input for query -->
        <input type="text" name="q" placeholder="Search Google" required>
        <!-- Standard search button -->
        <button type="submit">Search</button>
        <!-- I'm feeling Lucky button triggers btnI parameter -->
        <button type="submit" name="btnI" class="lucky">I'm Feeling Lucky</button>
    </form>
</body>
</html>
